{% extends 'base.html' %}
{% load static %}

{% block meta %}
    <title>Edit Booking</title>
    <link rel="stylesheet" href="{% static 'css/checkout.css' %}">
{% endblock meta %}

{% block content %}
<div class="checkout-container">
    
    <div class="checkout-header">
        <a href="{% url 'checkout:booking_history' %}" class="back-button">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="15 18 9 12 15 6"></polyline>
            </svg>
        </a>
        <h1 class="checkout-title">Edit Booking</h1>
    </div>

    <div class="booking-details-card" style="margin: 0 auto; max-width: 600px;">
        
        <!-- Message area for AJAX responses -->
        <div id="form-messages"></div>

        <!-- AJAX FORM -->
        <form method="POST" id="edit-booking-form">
            {% csrf_token %}

            <div class="form-group">
                <label>Class Name</label>
                <input type="text" value="{{ class.name }}" readonly class="form-control" />
            </div>

            <div class="form-group">
                <label for="{{ form.full_name.id_for_label }}">Full Name</label>
                {{ form.full_name }}
            </div>

            <div class="form-row">
                <div class="form-group half-width">
                    <label for="{{ form.phone_number.id_for_label }}">Phone Number</label>
                    {{ form.phone_number }}
                </div>

                <div class="form-group half-width">
                    <label for="{{ form.email.id_for_label }}">Email</label>
                    {{ form.email }}
                </div>
            </div>

            <div style="text-align: right; margin-top: 20px;">
                <button type="submit" class="confirm-button">Save Changes</button>
            </div>
        </form>
    </div>
</div>

<!-- AJAX SCRIPT -->
<script>
document.getElementById("edit-booking-form").addEventListener("submit", async function(e) {
    e.preventDefault();

    let form = e.target;
    let formData = new FormData(form);
    let csrfToken = document.querySelector("[name=csrfmiddlewaretoken]").value;

    let response = await fetch("", {
        method: "POST",
        headers: {
            "X-CSRFToken": csrfToken
        },
        body: formData
    });

    let data = await response.json();
    let msgDiv = document.getElementById("form-messages");

    if (data.success) {
        msgDiv.innerHTML = `<p style="color: green; margin-bottom: 10px;">${data.message}</p>`;
    } else {
        msgDiv.innerHTML = `<p style="color: red; margin-bottom: 10px;">${data.error}</p>`;
    }
});
</script>

{% endblock content %}
