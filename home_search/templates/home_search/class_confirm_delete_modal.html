<form method="post" action="" id="class-delete-form">
  {% csrf_token %}
  <p class="mb-4 text-gray-700">
    Are you sure you want to delete
    <span class="font-semibold">“{{ object.name }}”</span>?
    This action cannot be undone.
  </p>
  <div class="flex justify-end gap-3">
    <button type="button"
            id="class-delete-cancel"
            class="px-4 py-2 rounded-xl border">
      Cancel
    </button>
    <button class="px-4 py-2 rounded-xl bg-[#E6554A] text-white">
      Delete
    </button>
  </div>
</form>
